name: Trigger Anka report pipeline

on:
  schedule:
    # Every 10 minutes. GitHub's minimum supported interval is 5 minutes;
    # actual firing can lag a few minutes during high load, but is otherwise reliable.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you also fire it manually from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the PythonAnywhere trigger endpoint
        run: |
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://yogakaar.pythonanywhere.com/trigger" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET }}")
          echo "HTTP status: $http_code"
          cat /tmp/response.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "Trigger endpoint did not return success"
            exit 1
          fi
